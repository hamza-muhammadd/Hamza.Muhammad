<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f1ec"><title>Hamza Muhammad</title><meta name="description" content="Contact Hamza Muhammad.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/fav/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="assets/fav/favicon-16.png"><link rel="icon" type="image/png" sizes="48x48" href="assets/fav/favicon-48.png"><link rel="apple-touch-icon" sizes="180x180" href="assets/fav/favicon-180.png"><link rel="stylesheet" href="assets/site.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Newsreader:ital,opsz@1,6..72&display=swap" rel="stylesheet"></head>
<body><div class="aur" aria-hidden="true"><i></i><i></i></div><div id="nav"></div>
<main class="wrap">
<div class="page"><div class="card head"><p class="eyebrow">Start a conversation</p><h1>Let’s <em>connect.</em></h1><p data-k="contact_intro"></p></div>
<div class="grid2"><form id="f" class="card rv" novalidate><h2>Tell me what’s on your mind.</h2>
<label>Your name<input name="name" required maxlength="100" autocomplete="name"></label><label>Your email<input name="email" type="email" required maxlength="200" autocomplete="email"></label>
<label>Subject<input name="subject" maxlength="200"></label><label>Message<textarea name="message" rows="5" required minlength="5" maxlength="4000"></textarea></label>
<input id="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><button class="btn p" type="submit">Send message</button><div id="msg" role="status"></div></form>
<div class="card rv"><p class="eyebrow">Other ways</p><h2>Find me online</h2><div class="socials" id="socials"></div><div class="loop" style="display:block"><b style="color:var(--ink)">Good conversations start with clarity.</b><br>Share the context, what you need, and what a useful outcome would look like.</div></div></div></div>
</main><div class="wrap"><div id="foot"></div></div>
<script src="config.js"></script><script src="assets/site.js"></script></body></html>
